steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/warehouse-movements:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/warehouse-movements:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - warehouse-movements
      - --image
      - gcr.io/$PROJECT_ID/warehouse-movements:$COMMIT_SHA
      - --region
      - europe-west2
      - --platform
      - managed

images:
  - gcr.io/$PROJECT_ID/warehouse-movements:$COMMIT_SHA
